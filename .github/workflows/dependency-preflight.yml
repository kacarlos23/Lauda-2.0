name: Verify the public staging release

on:
  push:
    branches:
      - security/dependency-preflight-20261110

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify the public release and API
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { createHash } = require("node:crypto");
          const root = "https://testes.laudaapp.com";
          const expected = {"asset":"/_expo/static/js/web/index-3800975d5da413646c555df641b847c3.js","assetSha256":"b5fc986c44b2f83875ff9eb4387ea1edb0132dd2322963700ebad672343cbf19","commit":"16ad9faa9facedd08e257fe443f03d67682b48a3","sourceHash":"324927187ce4868d5fccf168339ec1877314fb697820f09506e044dd53b6d261","apiUrl":"https://testes.laudaapp.com/api"};
          async function get(path, status) {
            const response = await fetch(root + path, { redirect: "manual", cache: "no-store", signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, status, path + " HTTP " + response.status);
            return response;
          }
          (async () => {
            const [release, health, login] = await Promise.all([
              get("/release.json?verification=" + expected.commit, 200),
              get("/health", 200),
              get("/login", 200),
              get("/api/songs/tags", 401),
            ]);
            const manifest = await release.json();
            assert.equal(manifest.environment, "staging");
            assert.equal(manifest.commit, expected.commit);
            assert.equal(manifest.sourceHash, expected.sourceHash);
            assert.equal(manifest.apiUrl, expected.apiUrl);
            assert.equal((await health.json()).status, "ok");
            assert.ok((await login.text()).includes(expected.asset));
            const bundle = await get(expected.asset, 200);
            assert.equal(createHash("sha256").update(Buffer.from(await bundle.arrayBuffer())).digest("hex"), expected.assetSha256);
            console.log(JSON.stringify({ environment: "staging", commit: manifest.commit, sourceHash: manifest.sourceHash, health: 200, login: 200, protectedCatalog: 401, bundle: "verified" }));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
