name: Validate the staging navigation bundle

on:
  push:
    branches:
      - security/dependency-preflight-20261110

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      LAUDA_STAGE_COMMIT: 16ad9faa9facedd08e257fe443f03d67682b48a3
      EXPO_PUBLIC_API_URL: https://testes.laudaapp.com/api
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.LAUDA_STAGE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install and check the Expo SDK
        working-directory: mobile
        run: |
          npm ci
          npx expo install --check
      - name: Export the staging web bundle
        working-directory: mobile
        run: |
          node node_modules/expo/bin/cli export --platform web --max-workers 3 --output-dir "$RUNNER_TEMP/lauda-staging-web"
          node ../scripts/validate-frontend-api.cjs --dist "$RUNNER_TEMP/lauda-staging-web"
      - name: Write the staging manifest
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const git = (...args) => execFileSync("git", args);
          const commit = git("rev-parse", "HEAD").toString().trim();
          assert.equal(commit, process.env.LAUDA_STAGE_COMMIT);
          const environment = "staging";
          const apiUrl = process.env.EXPO_PUBLIC_API_URL;
          const sourceTree = git("rev-parse", "HEAD^{tree}").toString().trim();
          const sourceHash = crypto.createHash("sha256").update(git("ls-tree", "-rz", "HEAD"))
            .update(JSON.stringify({ environment, apiUrl })).digest("hex");
          const manifest = {
            environment, apiUrl, commit, backendCommit: commit, sourceTree, sourceHash,
            backendBuiltFrom: "93e1c52d652d7ff60d97ca5935e2eebd61f7b726", builtAt: new Date().toISOString(),
            validation: { webBuild: true, expoSdkCheck: true, dependencyPR: 26 },
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "lauda-staging-web", "release.json"), JSON.stringify(manifest, null, 2) + "\n");
          console.log(JSON.stringify({ commit, sourceHash }));
          NODE
      - name: Retain the staging web candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-staging-web-compatible
          path: ${{ runner.temp }}/lauda-staging-web
          if-no-files-found: error
          retention-days: 3
      - name: Export the Android and iOS bundles
        working-directory: mobile
        run: |
          for platform in android ios; do
            node node_modules/expo/bin/cli export --platform "$platform" --max-workers 3 --output-dir "$RUNNER_TEMP/lauda-native/$platform"
          done
