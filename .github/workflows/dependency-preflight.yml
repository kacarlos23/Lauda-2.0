name: Check live Lauda endpoints

on:
  push:
    branches:
      - security/dependency-preflight-20261110

permissions:
  contents: read

jobs:
  public-status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the public application and API endpoints
        shell: bash
        run: |
          node <<'NODE'
          const endpoints = [
            ["production web", "https://laudaapp.com/"],
            ["production login", "https://laudaapp.com/login"],
            ["production manifest", "https://laudaapp.com/release.json"],
            ["production API", "https://api.laudaapp.com/health"],
            ["staging manifest", "https://testes.laudaapp.com/release.json"],
          ];
          (async () => {
            const result = await Promise.all(endpoints.map(async ([name,url]) => {
              try {
                const r = await fetch(url, {cache:"no-store",signal:AbortSignal.timeout(15000)});
                const row = {name,status:r.status,server:r.headers.get("server")};
                if (r.ok && (name.endsWith("manifest") || name.endsWith("API"))) {
                  const body = await r.json();
                  row.commit = body.commit;
                  row.environment = body.environment;
                  row.health = body.status;
                }
                return row;
              } catch (error) {
                return {name, error:error.cause?.code ?? error.name};
              }
            }));
            console.log(JSON.stringify(result));
            if (result.some(row => row.name.startsWith("production") && row.status !== 200)) process.exitCode = 1;
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
